<svg xmlns="http://www.w3.org/2000/svg" width="460" height="215" viewBox="0 0 460 215" role="img" aria-labelledby="title desc">
<title id="title">GitHub Overview</title>
<desc id="desc">Public repository counts, stars and forks; private repositories excluded.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}</style>
<rect x="1" y="1" width="458" height="213" rx="14" fill="#FFFFFF" stroke="#E5E7EB"/>
<text x="26" y="40" font-size="21" font-weight="700" fill="#6D28D9">GitHub Overview</text>
<path d="M26 55 H434" stroke="#E5E7EB"/>
<text x="26" y="91" font-size="14" font-weight="400" fill="#57606A">Public repositories</text>
<text x="432" y="91" font-size="17" font-weight="700" fill="#24292F" text-anchor="end">15</text>
<text x="26" y="120" font-size="14" font-weight="400" fill="#57606A">Original repositories</text>
<text x="432" y="120" font-size="17" font-weight="700" fill="#24292F" text-anchor="end">4</text>
<text x="26" y="149" font-size="14" font-weight="400" fill="#57606A">Stars received</text>
<text x="432" y="149" font-size="17" font-weight="700" fill="#24292F" text-anchor="end">1</text>
<text x="26" y="178" font-size="14" font-weight="400" fill="#57606A">Forks received</text>
<text x="432" y="178" font-size="17" font-weight="700" fill="#24292F" text-anchor="end">0</text>
<text x="26" y="195" font-size="11" font-weight="400" fill="#57606A">Source: public GitHub repositories</text>
</svg>
